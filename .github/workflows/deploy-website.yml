name: Deploy website (marketing + docs)

# The marketing site (apps/site) and the Starlight docs (apps/docs) are served
# by the `backlex-website` Worker (static assets only): `apps/site`'s
# `build:web` builds the site, builds apps/docs, and overlays it at `/docs`.
# That Worker is NOT wired to Cloudflare Workers Builds, so without this a doc/
# site change never reaches backlex.com. This builds + `wrangler deploy`s it on
# every push to main that touches the site or docs (and on manual dispatch).
on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "apps/docs/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Cache bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: |
          n=0
          until bun install --frozen-lockfile; do
            n=$((n+1)); [ "$n" -ge 3 ] && { echo "bun install failed after $n attempts"; exit 1; }
            echo "bun install flaked (attempt $n) — retrying in 10s"; sleep 10
          done

      # Builds the marketing site AND apps/docs, overlaying docs at ./dist/docs
      # (includes Astro's ClientRouter view-transitions runtime).
      - name: Build site + docs
        run: bun run --cwd apps/site build:web

      - name: Deploy backlex-website
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy
