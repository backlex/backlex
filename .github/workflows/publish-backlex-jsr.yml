name: Publish backlex (JSR)

# Publishes packages/client to JSR as `@backlex/backlex` (TypeScript source).
# Trigger:
#   - push a tag of the form `backlex-v<semver>` (e.g. `backlex-v0.0.1`)
#   - or run manually from the Actions tab
#
# No secret needed: JSR authenticates via GitHub Actions OIDC (id-token: write).
# Prerequisite: the `backlex` scope must exist on jsr.io and be linked to this
# repo (jsr.io → scope settings → GitHub Actions). The public API is free of
# slow types, so JSR generates full .d.ts for Node consumers.

on:
  push:
    tags:
      - "backlex-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for JSR OIDC auth

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run --cwd packages/client typecheck

      # `jsr publish` does NOT error on a version it already holds — it prints
      # `Warning: Skipping, already published @backlex/backlex@x.y.z` and exits
      # 0. That is how `backlex-v0.4.0` and `backlex-v0.4.1` each ran this
      # workflow, each published nothing, and each reported GREEN: `jsr.json`
      # had drifted to 0.3.3 while package.json moved on. The drift itself is
      # now pinned by apps/web/tests/sdk/sdk-exports.test.ts, but the exit code
      # still says "fine" for the one outcome that means nothing shipped, so a
      # re-run of an old tag would be just as silent.
      #
      # `pipefail` is load-bearing: GitHub's default shell is `bash -e`, which
      # takes the exit status of `tee`, not of `jsr`.
      - name: Publish to JSR
        working-directory: packages/client
        run: |
          set -o pipefail
          bunx jsr publish 2>&1 | tee /tmp/jsr-publish.log
          if grep -q "Skipping, already published" /tmp/jsr-publish.log; then
            echo "::error::jsr publish skipped the upload — that version is already on JSR, so this run shipped NOTHING. Check packages/client/jsr.json against the tag."
            exit 1
          fi
