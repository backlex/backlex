name: Publish backlex (npm)

# Publishes packages/client to npm as `backlex` (compiled ESM + types).
# Trigger:
#   - push a tag of the form `backlex-v<semver>` (e.g. `backlex-v0.0.1`)
#   - or run manually from the Actions tab with a version override
#
# Required repo secret:
#   - NPM_TOKEN   (npm automation token with publish access for @backlex / backlex)
#
# The committed package.json points at src/ (the monorepo consumes source with no
# build step). This workflow builds dist/ with tsup, rewrites the manifest to the
# compiled output, then `npm publish` with provenance.

on:
  push:
    tags:
      - "backlex-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override (e.g. 0.0.2). Leave blank to publish the version in packages/client/package.json."
        required: false
        type: string

permissions:
  contents: read
  id-token: write   # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run --cwd packages/client typecheck

      - name: Apply manual version override
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
        working-directory: packages/client
        run: npm version --no-git-tag-version "${{ inputs.version }}"

      - name: Build (tsup → dist)
        run: bun run --cwd packages/client build

      - name: Rewrite manifest for compiled publish
        run: node packages/client/scripts/npm-manifest.mjs

      - name: Dry-run pack (logs tarball contents)
        working-directory: packages/client
        run: npm pack --dry-run

      - name: Publish to npm
        working-directory: packages/client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
