name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          n=0
          until bun install --frozen-lockfile; do
            n=$((n+1)); [ "$n" -ge 3 ] && { echo "bun install failed after $n attempts"; exit 1; }
            echo "bun install flaked (attempt $n) — retrying in 10s"; sleep 10
          done

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Smoke tests
        run: bun run test

  # Verifies the same source builds cleanly for all four deploy targets
  # (Bun is covered by the typecheck above; this job exercises Cloudflare
  # Workers, Vercel Build Output API, and Netlify Function bundling).
  # Catches edge-only regressions the in-process SQLite test suite can't
  # see — missing shims, raw-TCP imports leaking into the worker bundle,
  # Bun-only APIs leaking into the Vercel/Netlify Node bundle.
  build-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          n=0
          until bun install --frozen-lockfile; do
            n=$((n+1)); [ "$n" -ge 3 ] && { echo "bun install failed after $n attempts"; exit 1; }
            echo "bun install flaked (attempt $n) — retrying in 10s"; sleep 10
          done

      - name: Build all targets
        run: bun run build:targets

  # Boots each runtime in-runner and exercises the same smoke contract
  # over real HTTP. Catches runtime-specific regressions the build job
  # can't see: bundle import-time errors, runtime-conditional adapter
  # selection (isStatelessEdge etc.), cookie / auth round-trips on a
  # real fetch boundary, and the cron-secret gate on Vercel/Netlify
  # entries. No external service calls — postgres is a job-scoped
  # service container; CF uses `wrangler dev --local` against
  # wrangler.ci.toml (sibling of wrangler.toml minus the [ai] binding
  # so wrangler login isn't required).
  runtime-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, vercel, netlify, cloudflare]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workeros_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/workeros_smoke
      # Disable wrangler's opt-in telemetry call — CF runtime smoke
      # shouldn't reach out to any external service.
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          n=0
          until bun install --frozen-lockfile; do
            n=$((n+1)); [ "$n" -ge 3 ] && { echo "bun install failed after $n attempts"; exit 1; }
            echo "bun install flaked (attempt $n) — retrying in 10s"; sleep 10
          done

      - name: Build all targets
        run: bun run build:targets

      - name: Run ${{ matrix.runtime }} smoke
        env:
          SMOKE_RUNTIME: ${{ matrix.runtime }}
          PORT: 8787
        run: bun apps/web/tests/smoke/orchestrate.ts
