name: Test

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "apps/docs/**"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "apps/docs/**"
      - "LICENSE"
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch)
# so we don't pay for stale in-flight runs. Release/tag workflows are
# separate and intentionally not covered here.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Light gate — runs on EVERY PR and every push to main. Fast + cheap
  # (one runner, no service containers, no platform builds). This is the
  # signal a PR waits on.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Cache bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: |
          n=0
          until bun install --frozen-lockfile; do
            n=$((n+1)); [ "$n" -ge 3 ] && { echo "bun install failed after $n attempts"; exit 1; }
            echo "bun install flaked (attempt $n) — retrying in 10s"; sleep 10
          done

      - name: Lint
        run: bun run lint

      # `tsc --noEmit` is incremental, and its state file is the difference
      # between re-checking 7 million types and re-checking the handful a
      # commit actually touched. Keyed on the commit so every run restores the
      # previous one's state and writes its own; the fallback prefix means a
      # first-time branch still starts from main's.
      - name: Cache typecheck state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            apps/web/node_modules/.cache/tsc
            packages/*/node_modules/.cache/tsc
          key: ${{ runner.os }}-tsc-${{ github.sha }}
          restore-keys: ${{ runner.os }}-tsc-

      - name: Typecheck
        run: bun run typecheck

      - name: Smoke tests
        run: bun run test

      # The example apps consume `packages/client` by source, so an SDK change
      # that breaks them only surfaces at bundle time — typecheck alone misses
      # runtime-shaped breakage (bad imports, removed subpath exports). Cheap:
      # four Vite builds, ~150ms each.
      - name: Build examples
        run: bun run build:examples

  # Decide whether the heavy build + runtime-smoke matrix needs to run.
  # It does whenever anything that feeds `build:targets` (app/server/client
  # source, shared packages, build scripts, runtime configs, the smoke
  # harness, or this workflow itself) changed. Pure test-only / config /
  # tooling diffs that can't affect a deploy bundle skip the heavy path.
  # Fails open: on the first run or an unknown base, the filter reports
  # changed and the heavy gate runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            heavy:
              - 'apps/web/src/**'
              - 'apps/web/index.html'
              - 'apps/web/vite.config.*'
              - 'apps/web/wrangler*.toml'
              - 'apps/web/vercel.ts'
              - 'apps/web/netlify/**'
              - 'apps/web/tests/smoke/**'
              - 'packages/**'
              - 'scripts/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/test.yml'

  # Heavy gate — pre-merge. Runs on the PR (so a red check blocks the merge)
  # and again on push to main (post-merge safety net for direct pushes),
  # but ONLY when `changes` says a build-relevant file moved.
  #
  # Builds every deploy target ONCE and publishes the output as an artifact
  # the runtime-smoke matrix downloads — so `build:targets` runs a single
  # time instead of being repeated in all eight smoke legs.
  build:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Cache bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: |
          n=0
          until bun install --frozen-lockfile; do
            n=$((n+1)); [ "$n" -ge 3 ] && { echo "bun install failed after $n attempts"; exit 1; }
            echo "bun install flaked (attempt $n) — retrying in 10s"; sleep 10
          done

      - name: Build all targets
        run: bun run build:targets

      # The published SDK. Nothing else in this workflow compiles it — until
      # now it was built for the first time inside publish-backlex.yml, which
      # only runs on a `backlex-v*` tag. So when tsup's declaration step broke
      # under TypeScript 6.0 (TS5101), `backlex` quietly became unpublishable
      # and no PR went red. ~1.3s here buys that back.
      - name: Build the SDK (tsup — catches .d.ts regressions before release)
        run: bun run --cwd packages/client build

      # Everything the runtime-smoke matrix needs to boot a server without
      # rebuilding: the SPA bundle + each serverless function bundle.
      #   apps/web/dist          → client/ (SPA), lambda/, gcp/, azure/, node/, deno/
      #   .vercel/output         → Vercel Build Output API tree (hidden dir!)
      #   apps/web/netlify/...   → pre-bundled Netlify function
      # `include-hidden-files` is required or upload-artifact v4 silently
      # drops the dot-prefixed `.vercel` tree.
      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-targets
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          path: |
            apps/web/dist
            apps/web/netlify/functions
            .vercel/output

  # Boots each runtime in-runner and exercises the same smoke contract over
  # real HTTP. Catches runtime-specific regressions the build job can't see:
  # bundle import-time errors, runtime-conditional adapter selection
  # (isStatelessEdge etc.), cookie / auth round-trips on a real fetch
  # boundary, and the cron-secret gate on the serverless entries. No external
  # service calls — postgres is a job-scoped service container; CF uses
  # `wrangler dev --local` against wrangler.ci.toml (sibling of wrangler.toml
  # minus the [ai] binding so wrangler login isn't required).
  #
  # Consumes the `build-targets` artifact instead of rebuilding (bun + the CF
  # `wrangler dev` leg recompile from source; the rest run the prebuilt
  # bundle). Skipped automatically when `build` is skipped (no heavy changes).
  runtime-smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, vercel, netlify, cloudflare, lambda, gcp, azure, deno]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backlex_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/backlex_smoke
      # Disable wrangler's opt-in telemetry call — CF runtime smoke
      # shouldn't reach out to any external service.
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # Only the deno leg needs the Deno runtime — it runs the pre-bundled
      # apps/web/dist/deno/server.mjs from the build-targets artifact.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: matrix.runtime == 'deno'
        with:
          deno-version: v2.x

      - name: Cache bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: |
          n=0
          until bun install --frozen-lockfile; do
            n=$((n+1)); [ "$n" -ge 3 ] && { echo "bun install failed after $n attempts"; exit 1; }
            echo "bun install flaked (attempt $n) — retrying in 10s"; sleep 10
          done

      - name: Download build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-targets

      - name: Run ${{ matrix.runtime }} smoke
        env:
          SMOKE_RUNTIME: ${{ matrix.runtime }}
          PORT: 8787
        run: bun apps/web/tests/smoke/orchestrate.ts

  # ── The pre-deploy gate ────────────────────────────────────────────────
  #
  # Cloudflare Workers Builds deploys on push to `main`, and this workflow runs
  # on push to `main`, and neither waits for the other. So the deploy that ships
  # a broken commit finishes while its own tests are still running, and the red
  # X arrives after the bad bundle is live. The suite is a tripwire, not a gate.
  #
  # It cannot be fixed inside the Cloudflare build either: measured, the `test`
  # job takes ~16 minutes and Cloudflare terminates a build at 20, so a build
  # that waited for the suite would be killed before doing its own work.
  #
  # The fix is to invert the trigger — let the suite start the build, instead of
  # the push starting both. Cloudflare documents a manual-build endpoint that
  # pins an exact commit, which is precisely this case.
  #
  # ⚠ INERT UNTIL CONFIGURED, on purpose. It needs three things that only a
  # human with dashboard access can provide, and it skips (green, with a note)
  # until they exist rather than failing every run:
  #
  #   1. secret  CF_API_TOKEN     — a USER-scoped token (account-scoped is not
  #                                 supported) with Workers Builds Configuration
  #                                 = Edit.
  #   2. secret  CF_ACCOUNT_ID
  #   3. secret  CF_BUILD_TRIGGER_UUID — from
  #      GET /accounts/{id}/builds/workers/{worker_tag}/triggers
  #
  # And one dashboard change, WITHOUT which this only adds a duplicate build:
  # turn the automatic branch trigger OFF for `main` (Worker → Settings →
  # Build). Then set PREDEPLOY_GATE_STRICT=1 in the build environment so
  # `scripts/require-green-checks.ts` refuses anything that reaches the builder
  # by another route.
  deploy:
    name: deploy (cloudflare, after tests)
    needs: [test, changes, build, runtime-smoke]
    # `always()` so a SKIPPED heavy path (build/runtime-smoke do not run on a
    # docs-only push) does not skip the deploy with it — but every job that DID
    # run must have succeeded. Without the explicit result checks, `always()`
    # would deploy on a red `test`, which is the one thing this job exists to
    # prevent.
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.test.result == 'success'
      && needs.changes.result == 'success'
      && needs.build.result != 'failure'
      && needs.build.result != 'cancelled'
      && needs['runtime-smoke'].result != 'failure'
      && needs['runtime-smoke'].result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Cloudflare build for this exact commit
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_BUILD_TRIGGER_UUID: ${{ secrets.CF_BUILD_TRIGGER_UUID }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ] || [ -z "$CF_BUILD_TRIGGER_UUID" ]; then
            echo "::notice::Pre-deploy gate not configured — Cloudflare is still deploying on push, alongside these tests rather than after them. See the comment above this job."
            exit 0
          fi
          echo "Triggering a Cloudflare build pinned to ${SHA}"
          code=$(curl -sS -o /tmp/cf.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"branch\":\"main\",\"commit_hash\":\"${SHA}\"}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/builds/triggers/${CF_BUILD_TRIGGER_UUID}/builds")
          echo "HTTP ${code}"
          cat /tmp/cf.json
          # A failed trigger must fail this job. A deploy that silently did not
          # happen is worse than one that did not happen loudly — the whole
          # point of moving the trigger here is that somebody is watching it.
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
