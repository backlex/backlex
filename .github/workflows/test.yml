name: Test

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Smoke tests
        run: bun run test

  # Verifies the same source builds cleanly for all four deploy targets
  # (Bun is covered by the typecheck above; this job exercises Cloudflare
  # Workers, Vercel Build Output API, and Netlify Function bundling).
  # Catches edge-only regressions the in-process SQLite test suite can't
  # see — missing shims, raw-TCP imports leaking into the worker bundle,
  # Bun-only APIs leaking into the Vercel/Netlify Node bundle.
  build-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build all targets
        run: bun run build:targets

  # Boots each runtime in-runner and exercises the same smoke contract
  # over real HTTP. Catches runtime-specific regressions the build job
  # can't see: bundle import-time errors, runtime-conditional adapter
  # selection (isStatelessEdge etc.), cookie / auth round-trips on a
  # real fetch boundary, and the cron-secret gate on Vercel/Netlify
  # entries. No external service calls — postgres is a job-scoped
  # service container, Cloudflare is excluded (its [ai] binding needs
  # wrangler login; build-targets already covers CF bundle validation).
  runtime-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, vercel, netlify]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workeros_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/workeros_smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build all targets
        run: bun run build:targets

      - name: Run ${{ matrix.runtime }} smoke
        env:
          SMOKE_RUNTIME: ${{ matrix.runtime }}
          PORT: 8787
        run: bun apps/web/tests/smoke/orchestrate.ts
