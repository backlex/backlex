name = "backlex-website"
compatibility_date = "2025-01-01"

# Apex marketing site + docs, served as a static-assets-only Worker (no script).
# Build/assemble with `bun run build:web` (vite build + overlay the Starlight
# docs from apps/docs into ./dist/docs). The apex route needs a proxied A/AAAA
# record on backlex.com (the *.backlex.com wildcard does NOT cover the apex).
#
# The `backlex.com/*` route is managed in the Cloudflare dashboard, NOT declared
# here: the CI deploy token (CLOUDFLARE_API_TOKEN) has Workers Scripts perms but
# not Zone › Workers Routes, so a `routes = [...]` entry makes `wrangler deploy`
# fail on the route-reconcile step (Authentication error 10000) even though the
# worker + assets upload fine. The route is stable, so leaving it dashboard-
# managed lets CI deploy cleanly. To re-declare routes here, grant the token
# Zone › Workers Routes › Edit on the backlex.com zone.

[assets]
directory = "./dist"
not_found_handling = "none"
