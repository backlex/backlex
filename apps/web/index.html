<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backlex Admin</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#7c5cff" />
    <meta name="theme-color" content="#08070f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- External (not inline) so the SPA can ship a strict `script-src 'self'`
         CSP without an unsafe-inline exception. Blocking + in <head> so the
         theme class lands before first paint (anti-FOUC). -->
    <script src="/theme-init.js"></script>
    <!-- Must run BEFORE the module bundle so its capture-phase error listener
         is installed when a stale `/assets/*` chunk fails to load. See the file
         header for why a stale document white-screens in the first place. -->
    <script src="/boot-recovery.js"></script>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
