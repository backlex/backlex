name = "workeros-api"
main = "src/server/entries/worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# bun:sqlite is imported transitively (drizzle's bun-sqlite driver +
# packages/db's createBunSqliteClient). The worker never calls those code
# paths — D1 is selected via env.D1 — but esbuild still resolves the import.
# The shim throws if anything ever does call it on Workers.
[alias]
"bun:sqlite" = "./src/server/shims/bun-sqlite-shim.ts"

[vars]
APP_URL = "https://workeros-api.kinyasfurkan.workers.dev"
# Comma-separated better-auth plugins enabled at boot. Mirrored in
# packages/auth/src/client.ts (passkey + magic-link plugin clients).
AUTH_PLUGINS = "passkey,magic-link,email-otp,anonymous"
# Extra origins allowed to make cross-origin, credentialled requests (on top
# of APP_URL and the origins derived from each workspace's
# auth_config.redirectUrls). Set this if customer apps live on other domains:
# EXTRA_TRUSTED_ORIGINS = "https://app.customer-a.com,https://app.customer-b.com"

# Serve the Vite SPA build (./dist) as static assets from the same Worker.
# SPA fallback returns index.html for unknown paths so React Router handles
# routing client-side. /api/* + /health are forced through the Worker so
# there's no chance of a static file shadowing the API.
[assets]
directory = "./dist/client"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health"]
# Override these in `.dev.vars` or via `wrangler secret put`:
# AUTH_SECRET = "..."
# DATABASE_URL = "postgres://..." # only if you want PG via Hyperdrive
# OPENAI_API_KEY = "..."
# FUNCTIONS_EXEC_URL = "https://fn-exec.example.com" # out-of-isolate executor;
#   see templates/fn-exec-server. When set, the `remote-http` sandbox provider
#   runs functions there (with ctx.db/fetch/email) instead of the in-isolate
#   QuickJS-WASM sandbox (sync-only). Pair with SANDBOX_RPC_TOKEN + SELF_URL.
# SANDBOX_RPC_TOKEN = "..." # openssl rand -hex 32 — required for ctx.* bridges.

# D1 (SQLite) — primary edge DB.
[[d1_databases]]
binding = "D1"
database_name = "workeros"
database_id = "5053e4b4-bd46-4bde-b4c2-48dbaed12ce2"

# R2 — file storage.
[[r2_buckets]]
binding = "R2"
bucket_name = "workeros-files"

# Vectorize — vector index for embeddings (1536 dim, cosine).
[[vectorize]]
binding = "VECTORIZE"
index_name = "workeros-embeddings"

# Optional: Hyperdrive proxy in front of Postgres for PG-on-edge.
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "REPLACE_WITH_HYPERDRIVE_ID"

# Durable Object for realtime fan-out.
[[durable_objects.bindings]]
name = "REALTIME"
class_name = "RealtimeRoom"

[[migrations]]
tag = "v1"
new_classes = ["RealtimeRoom"]

# Cron triggers — every minute. Adjust as needed (Cloudflare allows
# multiple expressions but minimum granularity is 1 minute).
[triggers]
crons = ["* * * * *"]
