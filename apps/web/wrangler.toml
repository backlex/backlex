name = "backlex-admin"
main = "src/server/entries/worker.ts"
# ⚠ Keep this in step with the workerd this repo INSTALLS, never ahead of it.
# `2026-08-11` is what `workerd@1.20260811.1` (via wrangler 4.123.0) honours; a
# later date is silently clamped locally while production's newer runtime obeys
# it, so `bun run dev`, the CI build and the deployed Worker would stop agreeing
# about the same bundle. Raise this and the wrangler pin together, and read the
# flags added since — the last twenty months brought node:http/https clients
# (2025-08-15), node:fs + node:os + process v2 (2025-09-15), http.createServer
# (2025-09-01), Node-shaped timers (2026-02-10), node:child_process /
# worker_threads / perf_hooks stubs (2026-03-17), and nodejs_compat on by
# default (2026-08-04) — which is why `nodejs_compat` below is now redundant
# but harmless, and is kept so an older-dated fork still gets it.
compatibility_date = "2026-08-11"
compatibility_flags = ["nodejs_compat"]

# Workers Logs — persist invocation logs (console.* + uncaught exceptions) so
# we can query them later in the dashboard / via `wrangler tail` history. Off
# by default on Workers; turn it on fleet-wide so prod debugging of a
# provisioned instance doesn't depend on catching a live `wrangler tail`.
# head_sampling_rate = 1 keeps every invocation's logs (drop it below 1.0 if
# log volume becomes a cost concern).
[observability]
enabled = true
head_sampling_rate = 1

# bun:sqlite is imported transitively (drizzle's bun-sqlite driver +
# packages/db's createBunSqliteClient). The worker never calls those code
# paths — D1 is selected via env.D1 — but esbuild still resolves the import.
# The shim throws if anything ever does call it on Workers.
# nodemailer is imported by the SMTP email adapter; SMTP needs raw TCP and is
# never selected on Workers (HTTP providers — resend/sendgrid/mailgun/ses —
# are used instead), so it's aliased to a throwing stub here too.
# ldapts is imported by the LDAP/AD auth adapter; LDAP also needs raw TCP and
# is never selected on Workers (use SAML SSO instead). Same shim pattern.
[alias]
"bun:sqlite" = "./src/server/shims/bun-sqlite-shim.ts"
"nodemailer" = "./src/server/shims/nodemailer-shim.ts"
"ldapts" = "./src/server/shims/ldapts-shim.ts"
# sharp is a native addon — unusable on the Workers isolate. The sharp image
# adapter is gated out on Workers (CF Image Resizing handles edge resize); this
# stub keeps the dynamic import() from pulling the native binary into the bundle.
"sharp" = "./src/server/shims/sharp-shim.ts"
# @cf-wasm/photon backs the Deno-only WASM image fallback; stub on Workers so its
# WASM blob never enters the Worker bundle (CF Image Resizing is used here).
"@cf-wasm/photon" = "./src/server/shims/photon-shim.ts"
# ⚠️ The Postgres aliases (`postgres`, `@neondatabase/serverless`,
# `@backlex/db/pg`, `@backlex/db/pg/schema`) are deliberately NOT here — they
# live only in `vite.config.ts`. `.wrangler/deploy/config.json` is a redirected
# config pointing at `dist/backlex_admin/wrangler.json`, so `wrangler deploy`
# ships the Vite-built bundle and this `[alias]` block never sees them.
# Consequence worth knowing: a bundle produced from `main` directly (this file
# with no redirect, e.g. `wrangler.ci.toml` in the CI runtime smoke) DOES carry
# the real pg schema, so it is not byte-comparable with what deploys. Either
# way Postgres is refused at runtime on Workers — see `context.ts`.

[vars]
# ⚠️ FORKS MUST CHANGE THIS. `APP_URL` is the canonical origin better-auth
# builds callback/redirect URLs from and the origin the CORS allow-list is
# seeded with — leaving it pointing at somebody else's deployment breaks
# sign-in on yours. The value below is *this* repo's own control worker, not a
# placeholder: it is load-bearing for the live deploy, so don't "clean it up"
# in place — a fork replaces it, and `R2_PUBLIC_BASE` below, with its own.
APP_URL = "https://backlex-admin.kinyasfurkan.workers.dev"
# Public r2.dev origin for the `workeros-files` R2 bucket. Lets the storage
# route ask Cloudflare Image Resizing to transform public files at the edge
# (no bytes through the Worker isolate). Only used when the row's ACL is
# `public` — private files stay behind the Worker. Enabled with:
#   wrangler r2 bucket dev-url enable workeros-files
R2_PUBLIC_BASE = "https://pub-608efd24875b4982a0592efb86a9b63c.r2.dev"
# Comma-separated better-auth plugins enabled at boot. Mirrored in
# packages/auth/src/client.ts (passkey + magic-link plugin clients).
AUTH_PLUGINS = "passkey,magic-link,email-otp,anonymous"
# Transactional email. EMAIL_FROM isn't a secret so it lives here; the
# provider API key is a secret — set it with `wrangler secret put RESEND_API_KEY`.
# Use a verified domain address here once DNS is set up (onboarding@resend.dev
# is Resend's shared test sender — fine to start, rate-limited for real use).
EMAIL_PROVIDER = "resend"
EMAIL_FROM = "onboarding@resend.dev"
# Extra origins allowed to make cross-origin, credentialled requests (on top
# of APP_URL and the origins derived from each workspace's
# auth_config.redirectUrls). Set this if customer apps live on other domains:
# EXTRA_TRUSTED_ORIGINS = "https://app.customer-a.com,https://app.customer-b.com"

# Two containment guards from the identity-containment work, both shipped in
# `warn` and flipped here on 2026-08-30.
#
# They are set in this FILE rather than in the Cloudflare dashboard on purpose:
# a dashboard-only setting is invisible from the repo, which is the shape that
# has already bitten this project three times (see the BUN_VERSION and
# PREDEPLOY_GATE_TOKEN notes in CLAUDE.md). Here they are reviewable and they
# deploy with the code that reads them.
#
# PLANE_GUARD — `middleware/plane-firewall.ts`. Every route prefix declares
# which auth plane may call it (`lib/route-planes.ts`); a mismatch is a 403
# instead of a log line. A path the registry does not name is still allowed in
# either mode, deliberately: a typo in the registry must not take the site down.
#
# Redundant since the default became `enforce` (2026-09) — kept because this
# file is where an operator looks to see what the deploy is running, and a value
# stated is a value nobody has to go and derive. Set it to "warn" to opt out.
PLANE_GUARD = "enforce"
# PERMISSION_WRITE_CHECK — `services/items/write.ts`. A permission's condition
# (`owner_id = $user.id`) used to filter READS only, so a role could create or
# hand over a row it could never see afterwards. This makes the condition judge
# the row a write PROPOSES.
#
# Both defaulted to `warn` so an existing integration writing cross-scope rows
# would be visible in the logs before it was broken. That window is closed
# because there are no third-party customers on this instance — the only test
# tenant is the maintainer's own account. A deployment with real customers
# should run `warn` first and grep for `plane-violation` / `permission-write-check`
# with `"allowed"` before setting these.
#
# NOTE these do not close the whole hole: a write whose every condition uses a
# relation path the in-memory evaluator cannot judge is skipped in BOTH modes
# and logs `permission-write-check-skipped`.
PERMISSION_WRITE_CHECK = "enforce"

# Serve the Vite SPA build (./dist) as static assets from the same Worker.
# SPA fallback returns index.html for unknown paths so React Router handles
# routing client-side. /api/*, /health (+ /health/* for the readiness probe),
# and /mcp are forced through the Worker so there's no chance of a static file
# shadowing the API. `/health` is an EXACT match — without `/health/*` the SPA
# fallback serves index.html for /health/ready instead of the probe. (The MCP
# server lives at /mcp, not /api/mcp — without this override the Static Assets
# binding would intercept POST /mcp with 405s.)
[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
# /.well-known/* must reach the Worker: OAuth discovery documents (RFC 8414 /
# RFC 9728) for the MCP OAuth flow are served there — the SPA fallback would
# otherwise answer with index.html.
run_worker_first = ["/api/*", "/health", "/health/*", "/mcp", "/embed/*", "/f/*", "/book/*", "/b/*", "/.well-known/*"]
# Override these in `.dev.vars` or via `wrangler secret put`:
# AUTH_SECRET = "..."
# LIBSQL_URL = "libsql://..." # Turso/libSQL instead of D1 (DATABASE_URL/Postgres
# is not supported on Workers — see the note above the durable_objects block)
# LIBSQL_AUTH_TOKEN = "..."
# OPENAI_API_KEY = "..."
# EMBEDDING_HTTP_URL = "https://embed.internal.example.com" # TEI/Ollama container
# EMBEDDING_HTTP_TOKEN = "..." # optional bearer for the embeddings endpoint
# Email — EMAIL_PROVIDER picks one (console | resend | sendgrid | mailgun |
# ses); unset = auto-detect from whichever provider's keys are set, else log
# to stdout. All providers need EMAIL_FROM (use a verified domain in prod).
# NOTE: the `smtp` provider is NOT available on Workers (no raw TCP) — use one
# of the HTTP providers below here. SMTP only works on Bun / Vercel / Netlify.
# EMAIL_PROVIDER = "resend"
# EMAIL_FROM = "onboarding@resend.dev"
# RESEND_API_KEY = "re_..."
# SENDGRID_API_KEY = "SG...."
# MAILGUN_API_KEY = "key-..." ; MAILGUN_DOMAIN = "mg.example.com" ; MAILGUN_HOST = "api.eu.mailgun.net"
# SES_REGION = "us-east-1" ; SES_ACCESS_KEY_ID = "AKIA..." ; SES_SECRET_ACCESS_KEY = "..."
# FUNCTIONS_EXEC_URL = "https://fn-exec.example.com" # out-of-isolate executor;
#   see templates/fn-exec-server. When set, the `remote-http` sandbox provider
#   runs functions there (with ctx.db/fetch/email) instead of the in-isolate
#   QuickJS-WASM sandbox (sync-only). Pair with SANDBOX_RPC_TOKEN + SELF_URL.
# SANDBOX_RPC_TOKEN = "..." # openssl rand -hex 32 — required for ctx.* bridges.
#   Set on the MAIN APP only: the executor receives a per-invocation signed
#   grant in the /run body's `rpcToken`, never this secret.
# FUNCTIONS_SANDBOX = "bun-worker" # opt into the in-process Bun worker. It is
#   NOT a sandbox — user code reaches node:fs / node:process / Bun.spawnSync —
#   and `admin` is self-serve, so set it only where function authors are the
#   operator. Unset picks remote-http (if FUNCTIONS_EXEC_URL) else QuickJS.

# D1 (SQLite) — primary edge DB.
[[d1_databases]]
binding = "D1"
database_name = "workeros"
database_id = "5053e4b4-bd46-4bde-b4c2-48dbaed12ce2"

# R2 — file storage.
[[r2_buckets]]
binding = "R2"
bucket_name = "workeros-files"

# R2 — the SECOND bucket, holding only `acl: "public"` files.
#
# Optional. Without it everything lives in `R2` above, which is what this
# deployment does today — and it is why `R2_PUBLIC_BASE` currently exposes more
# than it should: `wrangler r2 bucket dev-url enable` makes EVERY object in a
# bucket fetchable at `https://pub-<hash>.r2.dev/<key>` by anyone who can guess
# the key, and that URL does not pass through the Worker where `acl` is
# enforced. Private files, backups, generated PDFs and avatars all share that
# bucket.
#
# To close it:
#   1. wrangler r2 bucket create workeros-public
#   2. uncomment the block below and deploy
#   3. wrangler r2 bucket dev-url enable workeros-public
#   4. point R2_PUBLIC_BASE at the NEW bucket's pub-*.r2.dev origin
#   5. POST /api/storage/_split-buckets (dryRun first) until `cursor` is null
#   6. wrangler r2 bucket dev-url disable workeros-files  ← last, not first:
#      in the other order every public asset 404s until step 5 finishes.
#
# [[r2_buckets]]
# binding = "R2_PUBLIC"
# bucket_name = "workeros-public"

# Vectorize — one index per embedding model. The model registry in
# packages/core/src/embedding-models.ts pins each binding to a specific
# dimension; the routes/adapter pick the right index by model name.
#
# All bindings are OPT-IN. Cloudflare validates every binding at deploy
# time, so referencing an index that doesn't exist in your account breaks
# the deploy. Uncomment ONLY the models you actually want, and create
# their indexes first with:
#   wrangler vectorize create backlex-openai-1536        --dimensions=1536 --metric=cosine
#   wrangler vectorize create backlex-openai-3072        --dimensions=3072 --metric=cosine
#   wrangler vectorize create backlex-bge-m3             --dimensions=1024 --metric=cosine
#   wrangler vectorize create backlex-self-host-bge-m3   --dimensions=1024 --metric=cosine

# OpenAI text-embedding-3-small (1536). Needs OPENAI_API_KEY.
# [[vectorize]]
# binding = "VECTORIZE_OPENAI"
# index_name = "backlex-openai-1536"

# OpenAI text-embedding-3-large (3072). Needs OPENAI_API_KEY.
# Note: pgvector HNSW caps at 2000 dims — use IVFFlat for the PG table.
# [[vectorize]]
# binding = "VECTORIZE_OPENAI_LARGE"
# index_name = "backlex-openai-3072"

# Workers AI bge-m3 (1024, multilingual). Needs the [ai] binding below.
# [[vectorize]]
# binding = "VECTORIZE_BGE_M3"
# index_name = "backlex-bge-m3"

# Self-hosted bge-m3 (TEI/Ollama container). Needs EMBEDDING_HTTP_URL.
# Data never leaves your infrastructure.
# [[vectorize]]
# binding = "VECTORIZE_SELF_HOST_BGE_M3"
# index_name = "backlex-self-host-bge-m3"

# Workers AI — required for the bge-m3 embedding model
# (`@cf/baai/bge-m3`). No keys needed; daily Neuron quota covers small/
# medium use. Remove this block if you only use OpenAI embeddings.
[ai]
binding = "AI"

# NO HYPERDRIVE / NO POSTGRES HERE — this is not an omission.
# The Workers bundle ships without a Postgres driver: `vite.config.ts` aliases
# `postgres`, `@neondatabase/serverless` and both `@backlex/db/pg` entrypoints
# to shims so every pgTable def and `drizzle-orm/pg-core` stay out of the eager
# cold-start graph (`@backlex/db/pg` is statically imported across ~80 files).
# Binding Hyperdrive here would produce a config that boots and then throws on
# the first query, so `context.ts` refuses it with an explicit message instead.
# For a networked database on Workers use LIBSQL_URL (Turso/libSQL), which is
# fetch-based and not shimmed. For Postgres, deploy the Bun, Node, Vercel or
# Netlify target. See docs/deployment.md § Postgres on Workers.

# Durable Object for realtime fan-out.
[[durable_objects.bindings]]
name = "REALTIME"
class_name = "RealtimeRoom"

# Durable Object backing the rate limiter (lib/rate-limit.ts). One DO per
# (label, ip) — collapses isolate-rotation drift into a single authoritative
# counter, so the limit can't be bypassed by spreading requests across the
# many isolates Cloudflare may spin up per colo. Bun / Vercel / Netlify
# don't have this binding and fall back to the in-process Map.
[[durable_objects.bindings]]
name = "RATE_LIMIT"
class_name = "RateLimitRoom"

[[migrations]]
tag = "v1"
new_classes = ["RealtimeRoom"]

[[migrations]]
tag = "v2"
new_classes = ["RateLimitRoom"]

# Cron triggers — every minute. Adjust as needed (Cloudflare allows
# multiple expressions but minimum granularity is 1 minute).
[triggers]
crons = ["* * * * *"]
