# `globalStore` was tried on 2026-08-23 and turned back OFF. Leaving the switch
# here with the reason attached, because the upside is real and someone will
# want to try it again.
#
# What it does: isolated installs (already the default here — workspaces plus
# lockfile configVersion 1) COPY every package into
# `node_modules/.bun/<pkg>@<ver>`. `globalStore` materialises each one once into
# `<bun cache>/links/` and symlinks it in instead. Measured on this repo:
# `node_modules` 2.5 GB -> 466 MB, and a wiped-node_modules warm-cache install
# of 1448 packages in 5.4s. That is the path CI takes TEN times per push (the
# test job, the build job, and eight runtime-smoke matrix legs each run their
# own `bun install --frozen-lockfile`), and it is also why `.claude/worktrees/`
# once reached 62 GB — every agent session carried a full copy.
#
# Why it is off: it breaks `bun run typecheck`. Reproducer, and note that the
# wipe has to include the PER-WORKSPACE node_modules or the A/B is
# contaminated — `rm -rf node_modules` at the root leaves nineteen of them:
#
#   find apps packages examples -maxdepth 2 -name node_modules -type d \
#     -exec rm -rf {} + ; rm -rf node_modules
#   bun install --frozen-lockfile
#   bun run --cwd examples/react-router-app typecheck
#
# With globalStore that fails `app/root.tsx(58,29): error TS7031: Binding
# element 'isActive' implicitly has an 'any' type` — a NavLink `className`
# render prop losing its type. With it off, the same tree passes. The mechanism
# is type identity: a symlinked package resolves to a realpath under the
# machine-global cache, and its peer types stop resolving inside the project,
# so the typed overload no longer matches.
#
# One workspace fails today, and the rest of the 7-million-type check passes —
# but the mechanism is general, not local to that file. A silent type-identity
# change underneath the most expensive and most fragile gate in this repo is
# not worth 2 GB of disk. Revisit when Bun's isolated store keeps peer type
# resolution project-local; the check is the four lines above.
[install]
globalStore = false

# Root test config — mirrors apps/web/bunfig.toml so `bun test` behaves the
# same from the repo root as from apps/web. The lefthook pre-push hook runs
# `bun test` from the root; without these preloads the React render tests
# under apps/web/tests/client/ fail with "document is not defined" (bun only
# reads the bunfig.toml of the directory it starts in, not the workspace's).
# Both preloads are additive/no-op for the backend specs — see each file's
# header.
[test]
preload = ["./apps/web/tests/client/lingui-macro.ts", "./apps/web/tests/client/happydom.ts"]
