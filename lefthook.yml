# Pre-commit gates. Run `bun install` once to install hooks (the `prepare`
# script invokes `lefthook install` automatically). After that every commit
# routes through these checks.
#
# Biome only, and deliberately so: it is incremental on the staged file list,
# so a commit costs ~200ms.
#
# `bun run typecheck` USED to run here as well. It was removed because it was
# strictly redundant — it ignored {staged_files} and typechecked the whole repo
# (~145s), which is the same job pre-push already runs before anything can
# reach a remote. So it bought "know 145 seconds sooner" and charged that on
# every single commit, including doc-only and test-only ones.
#
# It also had a concrete failure mode: 145s exceeds the default command timeout
# of most tooling (including agent shells), so `git commit` would be killed
# mid-hook and the commit silently would not land. Type errors are still caught
# before they can leave the machine — pre-push runs typecheck, and test.yml
# runs it again in CI.
pre-commit:
  parallel: true
  jobs:
    - name: biome-lint
      glob: "*.{ts,tsx,js,jsx,json}"
      run: bunx --bun biome lint --no-errors-on-unmatched {staged_files}
    # Catches "added a migration but forgot to regenerate the bundle". The
    # generator is idempotent, so if the staged tree already has the
    # right bundles this is a no-op; otherwise the diff fails the hook.
    # Migration bundles are inlined into every runtime bundle so the boot-
    # time auto-migrate runner can apply them; an out-of-sync bundle means
    # production Postgres deploys silently miss the latest migration.
    - name: migration-bundles-in-sync
      glob: "packages/db/drizzle/**/migration.sql"
      run: bun scripts/gen-migration-bundles.ts && git diff --exit-code packages/db/src/pg/migrations-bundle.ts packages/db/src/sqlite/migrations-bundle.ts
    # The manifest is the OTHER generated artefact keyed off the same
    # directory, and it had no job here. `schema-declared-vs-shipped.test.ts`
    # went red within minutes of a merge that brought two new migrations,
    # because nothing local regenerates this file — a red suite with no local
    # gate is just friction, so the gate now exists.
    - name: migration-manifest-in-sync
      glob: "packages/db/drizzle/**/migration.sql"
      run: bun run --cwd packages/db manifest && git diff --exit-code packages/db/src/migrations-manifest.generated.ts
    # Same shape for the consent banner: its source is a real tree, and what
    # ships is a minified bundle checked in beside the server that serves it.
    #
    # This hook is the fast feedback, NOT the guarantee. Its glob watches the
    # SOURCES, so hand-editing the generated file or editing the generator
    # itself never triggers it, and `--no-verify` skips it entirely. The
    # guarantee is `apps/web/tests/consent-banner.test.ts`, which re-runs the same
    # comparison inside `bun test` and therefore inside CI.
    - name: consent-banner-in-sync
      # NOT `**/*.ts`: these sources sit directly in the directory with no
      # intermediate folder, and `**` demands one, so that glob matched NOTHING.
      # The migration job above only works because its paths really are nested.
      # A glob that matches nothing skips SILENTLY, which in the hook output
      # reads exactly like a job that ran and passed.
      glob: "apps/web/src/client/consent-banner/*"
      run: bun scripts/gen-consent-banner.ts && git diff --exit-code apps/web/src/server/services/consent-banner-bundle.ts
    # Third of the same shape, and it exists because the failure already
    # happened: `apps/web`'s `build` regenerates the static OpenAPI doc before
    # every vite build, so a route added without regenerating leaves the
    # committed copy one commit behind. `/api/admin/consent/postures/suggested`
    # shipped that way — the push's OWN build produced the diff and left it
    # sitting in the working tree, where nothing was looking.
    #
    # TWO globs, because route files live BOTH directly in the folder and one
    # level down (`routes/items/`, `routes/roles/`). `*` alone misses the
    # nested ones, `**/*` alone misses the flat ones — and a glob that matches
    # nothing SKIPS SILENTLY, which in the hook output reads exactly like a job
    # that ran and passed.
    #
    # The guarantee is the twin in
    # `apps/web/tests/openapi-subapp-coverage.test.ts`, which runs in CI and has
    # none of this hook's holes.
    - name: openapi-spec-in-sync
      glob:
        - "apps/web/src/server/routes/*.ts"
        - "apps/web/src/server/routes/*/*.ts"
      run: bun run --cwd apps/web gen:openapi-static && git diff --exit-code apps/web/src/server/lib/openapi-static.generated.json

# Pre-push: full CI parity. Branch protection on GitHub isn't available on
# free/private repos, so this hook is the only thing standing between a
# broken main and the deploy workflow. Same checks the workflow runs —
# any green-here / red-there divergence is a CI bug.
#
# Override with `git push --no-verify` ONLY when you're certain a transient
# issue (network, sandbox-only DB lock) is the cause; otherwise diagnose it.
# Deliberately SERIAL. This ran `parallel: true` until it was measured on the
# 8 GB dev machine (2026-08-15, cold cache, otherwise idle):
#
#                    parallel        serial
#   gate total        695s            715s
#   typecheck         695s            327s
#   test              657s            388s
#   total sys time    707s            292s
#
# So serialising does NOT make the gate finish sooner — 20s apart is inside this
# box's noise, because parallel's total is the longest job while serial's is the
# sum. What it buys is the last row: **2.4x less kernel paging**. typecheck
# genuinely needs >4 GB of live working set (measured under TypeScript 6.0,
# where lowering --max-old-space-size below 8192 OOM'd it outright; 7.0's Go
# checker has no such cap, which makes the point stronger, not weaker), so
# running it beside the test suite pushes an 8 GB machine into swap — `test`'s
# sys time alone drops 241s -> 33s once it stops competing.
# That contention is what once left two typechecks wedged in `U` state for 27
# minutes, thrashing, finishing never. The trade is: same wait, usable machine.
#
# CI is unaffected either way — test.yml runs these as separate jobs on separate
# runners with more RAM than this.
#
# (The `test` row above is now the pre-Bun-1.4 figure. The job itself runs
# `--parallel=4 --no-isolate` since 2026-08-23 and lands around 154s — see the
# comment on that job. The parallel-vs-serial *job* conclusion is unchanged:
# what it buys is paging headroom, not wall clock.)
#
# `--no-orphans` on every job: bun exits when lefthook dies and SIGKILLs every
# descendant. Without it, an agent shell hitting its command timeout mid-hook
# leaves the checker running — that is how an orphaned `tsc` once turned a
# 10-minute job into 82, because the next run paged against it instead of
# getting the machine to itself.
pre-push:
  parallel: false
  jobs:
    # Order matters now that these run one at a time: cheapest first, so a
    # failure costs seconds instead of the full ~12 minutes. Under `parallel:
    # true` the order was meaningless. None of these depend on another's output.
    - name: lint
      run: bun run --no-orphans lint
    # Per-target build verification. Catches edge-only regressions the
    # in-process SQLite test suite can't see: a missing shim, a fresh
    # node:net import, or a Bun-specific API leaking into the worker
    # bundle. Runs vite build once + three platform builds in parallel
    # (~6s total when caches are warm; cold first run ~15s).
    - name: build:targets
      run: bun run --no-orphans build:targets
    - name: typecheck
      run: bun run --no-orphans typecheck
    # `--timeout` stays at 30s. It was raised from Bun's 5s default because
    # contention made different specs lose the race each run, and `--parallel`
    # (below) puts some of that contention back deliberately. 30s still fails a
    # genuinely hung test. Nothing is gained by tightening it.
    #
    # `--parallel=4 --no-isolate` — measured on the 8 GB dev box, 515 files /
    # 6329 tests:
    #
    #                                    wall      result
    #   serial                           472.2s    6329 pass / 0 fail
    #   --parallel=4 --no-isolate        178.5s    6329 pass / 0 fail
    #   --parallel (default 8)            39.2s    358 fail, 346 errors
    #   --parallel=4 (implies --isolate)  >12min   killed
    #
    # Both flags are load-bearing and neither may be dropped:
    #
    # `--no-isolate`: bare `--parallel` implies `--isolate`, which gives every
    # file a fresh global and module registry. At 515 files that overhead
    # dominates — one spec (migrate-ingest) alone went to 301s — while worker
    # RSS stayed at 128-617 MB, so it is not memory. `--no-isolate` is also the
    # honest setting: the suite already runs every file in one shared registry.
    #
    # `=4`, pinned: the ceiling here is the SYSTEM file table, not cores or RAM.
    # This box has kern.maxfiles=30720 with ~7.5k already open, so 8 workers
    # overflow it and the run dies on `ENFILE` -> `unable to open database
    # file` -> cascading `h.cleanup is undefined`. Bun's default is the CPU
    # count, which is 8 here. Do not let it default.
    #
    # This does NOT contradict `parallel: false` above. That is about not
    # running the typecheck BESIDE the suite; this parallelises inside the test
    # job, which runs alone. sys time only went 42s -> 93s, nowhere near the
    # 241s that motivated serialising the hook.
    - name: test
      run: bun test --no-orphans --timeout 30000 --parallel=4 --no-isolate --timings=.github/test-timings.json

# Post-merge: reclaim agent worktrees. Parallel agent sessions each get a
# worktree under `.claude/worktrees/` and nothing removes them when the session
# ends; each carries its own `node_modules`, so the directory reached 62 GB
# before this hook existed. The publish flow's `git merge <feat/...>` is the
# natural sweep point — the branch has just landed, so its worktree is
# collectable by definition. Fires on `git pull` too, which is harmless: the
# script only removes worktrees that are orphaned, or merged + clean + idle.
# See scripts/cleanup-worktrees.ts for the full safety envelope.
post-merge:
  jobs:
    - name: cleanup-worktrees
      run: bun scripts/cleanup-worktrees.ts
