# Root config — deploys admin SPA (static) + API (edge function) together.

[build]
  base = ""
  command = "DEPLOY_TARGET=netlify bun install --frozen-lockfile && DEPLOY_TARGET=netlify bun run --cwd apps/web build"
  publish = "apps/web/dist/client"
  edge_functions = "apps/web/netlify/edge-functions"

[build.environment]
  BUN_VERSION = "1.3.14"

# Edge function claims the API surface. Anything outside /api/* falls through
# to static + SPA fallback below.
[[edge_functions]]
  function = "entry"
  path = "/api/*"

# Single-page-app fallback so client-side routes (/collections, /settings,
# /functions, …) all serve admin's index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cron — pings the same /_cron/tick the edge entry serves so dedupe state
# stays in one place. The scheduled function adds x-cron-secret from env.
[[scheduled_functions]]
  function = "cron"
  cron = "* * * * *"

[functions]
  directory = "apps/web/netlify/functions"
  deno_import_map = "apps/web/netlify/edge-functions/import_map.json"
