# Root config — deploys admin SPA (static) + API (Node Lambda function) together.

[build]
  base = ""
  command = "DEPLOY_TARGET=netlify bun install --frozen-lockfile && DEPLOY_TARGET=netlify bun run --cwd apps/web build && bun scripts/build-netlify-fn.ts"
  publish = "apps/web/dist/client"

[build.environment]
  BUN_VERSION = "1.3.14"

# Allow R2 public-bucket origins as remote sources for the Netlify Image CDN,
# so the storage route's `/.netlify/images?url=<R2 public URL>` redirect (see
# serve.ts — the Netlify analog of Cloudflare Image Resizing on Workers) is
# honored. Regex is double-escaped per Netlify's TOML rules. `build-netlify-fn`
# also writes the dynamic `.netlify/deploy/v1/config.json` equivalent, but this
# static block is read in every build path.
[images]
  remote_images = ["https:\\/\\/[a-z0-9.-]+\\.r2\\.dev\\/.*"]

# Runtime env injected into the Netlify Function (Node 22) for production
# deploys. better-auth's `trustedOrigins` is constructed once per isolate
# from APP_URL + EXTRA_TRUSTED_ORIGINS; without this list, sign-in from
# the Netlify host hits 403 INVALID_ORIGIN because APP_URL points at the
# CF Worker canonical origin (the same Neon DB is shared across deploys).
# Add the matching Vercel host too so a single deploy works from either.
# Secrets (DATABASE_URL, AUTH_SECRET, …) stay in the Netlify dashboard;
# this block is only for non-sensitive routing config.
[context.production.environment]
  APP_URL = "https://backlex.netlify.app"
  EXTRA_TRUSTED_ORIGINS = "https://backlex.vercel.app,https://backlex-admin.kinyasfurkan.workers.dev"

# API surface — Hono app served by a Node 22 serverless function.
# Edge Functions were dropped because Netlify's Deno edge bundler can't
# resolve this repo's npm/workspace dep tree (postgres-js, drizzle, samlify,
# quickjs, etc.). Functions run on Node 22, which matches our Bun/Node-compat
# source tree without code changes.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Non-/api endpoints that still live inside the Hono app — same routing rule
# as Cloudflare's `run_worker_first`. Without these the catch-all SPA
# fallback below intercepts /mcp + /health and serves index.html.
[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/api/mcp"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200

# OAuth discovery documents for the MCP OAuth flow (RFC 8414 / RFC 9728) —
# served by the Hono app, must not fall into the SPA fallback.
[[redirects]]
  from = "/.well-known/*"
  to = "/.netlify/functions/api/.well-known/:splat"
  status = 200

# The form embed loader — a Hono-served JavaScript file at a non-/api path.
# Without this it falls into the SPA fallback below and answers index.html as
# text/html, so the <script src> the admin hands out silently does nothing on
# the customer's page.
#
# ONLY this exact path, not /embed/*: the other /embed/* routes are inside
# `if (env.ASSETS)` and exist solely so Cloudflare's worker can stamp a
# framable CSP on the SPA shell. There is no ASSETS binding here, so routing
# them in would turn a working SPA fallback into a 404.
[[redirects]]
  from = "/embed/form.js"
  to = "/.netlify/functions/api/embed/form.js"
  status = 200

# Single-page-app fallback so client-side routes (/collections, /settings,
# /functions, …) all serve admin's index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cron — pings /api/_cron/tick (handled inside the Hono app) so dedupe
# state stays in one place. The scheduled function attaches x-cron-secret.
[[scheduled_functions]]
  function = "cron"
  cron = "* * * * *"

[functions]
  directory = "apps/web/netlify/functions"
  # Keep Netlify's default (nft) bundler. The Function `api.mjs` is
  # pre-bundled by `scripts/build-netlify-fn.ts` during the build
  # command — Bun inlines our `.ts` workspace packages there, which
  # Netlify's bundler can't do on its own. nft then just walks the
  # remaining npm imports and symlinks them into the zip.
