# Root config — deploys admin SPA (static) + API (Node Lambda function) together.

[build]
  base = ""
  command = "DEPLOY_TARGET=netlify bun install --frozen-lockfile && DEPLOY_TARGET=netlify bun run --cwd apps/web build && bun scripts/build-netlify-fn.ts"
  publish = "apps/web/dist/client"

[build.environment]
  BUN_VERSION = "1.3.14"

# API surface — Hono app served by a Node 22 serverless function.
# Edge Functions were dropped because Netlify's Deno edge bundler can't
# resolve this repo's npm/workspace dep tree (postgres-js, drizzle, samlify,
# quickjs, etc.). Functions run on Node 22, which matches our Bun/Node-compat
# source tree without code changes.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Single-page-app fallback so client-side routes (/collections, /settings,
# /functions, …) all serve admin's index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cron — pings /api/_cron/tick (handled inside the Hono app) so dedupe
# state stays in one place. The scheduled function attaches x-cron-secret.
[[scheduled_functions]]
  function = "cron"
  cron = "* * * * *"

[functions]
  directory = "apps/web/netlify/functions"
  # Keep Netlify's default (nft) bundler. The Function `api.mjs` is
  # pre-bundled by `scripts/build-netlify-fn.ts` during the build
  # command — Bun inlines our `.ts` workspace packages there, which
  # Netlify's bundler can't do on its own. nft then just walks the
  # remaining npm imports and symlinks them into the zip.
