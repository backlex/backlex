[project]
name = "backlex"
version = "0.0.1"
description = "Official Python client for the backlex API (CRUD, query builder, auth, realtime, storage)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "backlex" }]
keywords = ["backlex", "backend", "baas", "rest", "sdk"]
dependencies = [
  # Single runtime dependency: a modern HTTP client with streaming support
  # (used for both request/response and the SSE realtime transport).
  "httpx>=0.27",
  # NotRequired / TypedDict back-port for Python < 3.11.
  "typing_extensions>=4.6; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]

[project.urls]
Homepage = "https://backlex.com"
Documentation = "https://backlex.com/docs/sdk-and-cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backlex"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src/backlex"]
