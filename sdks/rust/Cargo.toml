[package]
name = "backlex"
version = "0.1.0"
edition = "2021"
description = "Official Rust client for the backlex API (CRUD, query builder, auth, realtime, storage)."
license = "Apache-2.0"
homepage = "https://backlex.com"
repository = "https://github.com/backlex/backlex"
documentation = "https://backlex.com/docs/client-sdks"
readme = "README.md"
keywords = ["backlex", "baas", "backend", "sdk", "rest"]
categories = ["api-bindings", "web-programming"]

[dependencies]
serde_json = "1"
# Blocking HTTP client for the default transport + SSE. The query-builder /
# condition core is pure serde_json and compiles to wasm32 without it.
ureq = "2"

[[example]]
name = "quickstart"
path = "examples/quickstart.rs"
